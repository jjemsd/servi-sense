# Render Blueprint — deploys backend (web service) + Postgres + frontend (static site)

databases:
  - name: servisense-db
    plan: basic-256mb        # matches the paid tier provisioned in Stage 1
    databaseName: servisense

services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: servisense-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: servisense-db
          property: connectionString
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        sync: false   # set this manually in Render dashboard after frontend deploys
      - key: PYTHON_VERSION
        value: 3.12.4

  # ── Frontend (static site) ─────────────────────────────────────────────────
  # Static sites are always free on Render and do NOT take a `plan` field.
  - type: web
    name: servisense-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false   # set to https://servisense-api.onrender.com in Render dashboard
    routes:
      - type: rewrite
        source: /*
        destination: /index.html