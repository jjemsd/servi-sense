# Render Blueprint — Stage 1: backend + database only.
# The static site for the frontend will be added in Stage 6.

databases:
  - name: servisense-db
    plan: free
    databaseName: servisense

services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: servisense-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: servisense-db
          property: connectionString
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        sync: false   # set this manually in Render dashboard after frontend deploys
      - key: PYTHON_VERSION
        value: 3.12.4