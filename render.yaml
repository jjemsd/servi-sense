# Render Blueprint — Stage 1: backend + paid Postgres.
# Frontend static site comes in Stage 6.

databases:
  - name: servisense-db
    plan: basic-256mb
    databaseName: servisense
    region: singapore
    postgresMajorVersion: "16"

services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: servisense-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: servisense-db
          property: connectionString
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.4